name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first one's result irrelevant, so
# don't pay for it. Never cancel on main: those runs publish an image, and a
# half-finished push is worse than a redundant one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Matches the build stage of the Dockerfile. If you bump one, bump the other,
  # or CI stops testing the toolchain that actually produces the image.
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Caches ~/.npm keyed on package-lock.json, not node_modules — `npm ci`
          # still wipes and reinstalls, so the tree stays exactly as locked.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Both tsconfigs are noEmit, so this is a pure typecheck; nothing is
      # written. `npm run build` would catch the same errors, but a dedicated
      # step says "types" instead of "build failed" when it goes red.
      - name: Typecheck
        run: npm run typecheck

      # Proves the bundle compiles on a PR. The image build repeats this against
      # the real API origin — here the URL is irrelevant, only that it builds.
      - name: Build
        run: npm run build

  image:
    name: Publish image to GHCR
    needs: quality
    # Only for real pushes to main. A pull_request from a fork has no write
    # token for the registry, and an unreviewed branch has no business shipping.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # provided by Actions, no setup

      # github.repository has capitals in it and registry paths must be
      # lowercase; this action normalises that for us rather than hand-rolling a
      # tr '[:upper:]' '[:lower:]'.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # Passing the variable straight through as a build-arg looks tempting, but
      # when it is unset the arg becomes `VITE_API_URL=` — an empty string, which
      # *overrides* the Dockerfile's default rather than leaving it alone. Both
      # readers (api/client.ts, context/RealtimeContext.tsx) then resolve to '',
      # because they guard with `??` and '' is not nullish: every call silently
      # becomes same-origin. So resolve the fallback here, and say so out loud.
      - name: Resolve API origin
        id: api
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          url="${VITE_API_URL:-http://localhost:4001/api}"
          if [ -z "$VITE_API_URL" ]; then 
            echo "::warning::VITE_API_URL is not set, so this image is baked against $url and will not reach a real API. Set it under Settings > Secrets and variables > Actions > Variables."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite inlines VITE_* at build time, so the API origin is frozen into
          # the bundle here — it cannot be changed when the container starts.
          build-args: |
            VITE_API_URL=${{ steps.api.outputs.url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Vercel
    needs: quality
    # Same gate as the image job: only real pushes to main ship to production.
    # A PR must not deploy — it has no reviewed code and (from a fork) no secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The Vercel CLI reads these on every invocation to know which project to
    # touch. All three come from running `vercel link` once locally; store them
    # as repo secrets under Settings > Secrets and variables > Actions > Secrets.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Downloads the project's settings and its Production env vars — including
      # the VITE_API_URL you set in the Vercel dashboard — into .vercel/ so the
      # build below can see them. Without this, `vercel build` has no env to bake.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Builds with Vercel's own toolchain (runs `npm run build` under the hood),
      # inlining the pulled VITE_API_URL into the bundle. Kept a separate step so
      # a compile failure reads as a build failure, not a deploy failure.
      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --prebuilt ships the artifact from the step above instead of rebuilding on
      # Vercel's servers, so what CI built is exactly what goes live.
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  cloudflare:
    name: Deploy to Cloudflare
    needs: quality
    # Same gate as the other deploys: production ships only from a real push to
    # main, never from a PR (which may be unreviewed and, from a fork, secretless).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same reasoning as the image job: an unset repo variable would make the
      # build-time env an empty string, not absent, so resolve the fallback here.
      - name: Resolve API origin
        id: api
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          url="${VITE_API_URL:-http://localhost:4001/api}"
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning::VITE_API_URL is not set, so this deploy is baked against $url. Set it under Settings > Secrets and variables > Actions > Variables."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Vite inlines VITE_* at build time, so the API origin is frozen into the
      # bundle now. SPA-route fallback is handled by wrangler.jsonc, not a file
      # in the bundle.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ steps.api.outputs.url }}

      # Fail early with a readable message if the secrets are missing — otherwise
      # wrangler fails deep inside with an opaque auth error. This is the single
      # most common cause of the deploy going red on first setup.
      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing — add them under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      # Deploys the built dist/ as a Workers Static Assets project, reading name
      # and the SPA config from wrangler.jsonc. `wrangler deploy` creates the
      # Worker on first run and updates it after, so no pre-create step is needed.
      # Called directly (not via cloudflare/wrangler-action) so wrangler's own
      # error reaches the log instead of a bare "npx failed with exit code 1".
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
