server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the way out.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Single-page app: the client owns routing, so any path that isn't a real
    # file (e.g. /listing/5, /dashboard) must return index.html and let React
    # Router resolve it. Without this, a hard refresh on those routes 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames with a content hash, so they can be
    # cached forever — a change ships under a new name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html itself must never be cached, or a client keeps loading the old
    # bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
